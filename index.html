<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地下空间公共安全巡查系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- 侧边栏 -->
        <aside id="sidebar" class="w-64 bg-slate-800 text-white flex-shrink-0 flex flex-col transition-all duration-300">
            <div class="p-4 border-b border-slate-700">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-shield-alt text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg">地下空间安全</h1>
                        <p class="text-xs text-slate-400">公共安全巡查系统</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 py-4 overflow-y-auto">
                <ul class="space-y-1 px-3">
                    <li>
                        <a href="#dashboard" class="nav-item active flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="dashboard">
                            <i class="fas fa-tachometer-alt w-5"></i>
                            <span>统计看板</span>
                        </a>
                    </li>
                    <li>
                        <a href="#spaces" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="spaces">
                            <i class="fas fa-building w-5"></i>
                            <span>空间台账</span>
                        </a>
                    </li>
                    <li>
                        <a href="#inspections" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="inspections">
                            <i class="fas fa-tasks w-5"></i>
                            <span>巡查任务</span>
                        </a>
                    </li>
                    <li>
                        <a href="#hazards" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="hazards">
                            <i class="fas fa-exclamation-triangle w-5"></i>
                            <span>隐患清单</span>
                        </a>
                    </li>
                    <li>
                        <a href="#equipment" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="equipment">
                            <i class="fas fa-cogs w-5"></i>
                            <span>设备状态</span>
                        </a>
                    </li>
                    <li>
                        <a href="#evacuation" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="evacuation">
                            <i class="fas fa-running w-5"></i>
                            <span>人员疏散</span>
                        </a>
                    </li>
                    <li>
                        <a href="#rectification" class="nav-item flex items-center space-x-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition" data-page="rectification">
                            <i class="fas fa-clipboard-check w-5"></i>
                            <span>整改跟踪</span>
                        </a>
                    </li>
                </ul>
                
                <div class="mt-6 px-3">
                    <p class="text-xs text-slate-400 px-4 mb-2">专项管理</p>
                    <ul class="space-y-1">
                        <li>
                            <a href="#floorplan" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition text-sm" data-page="floorplan">
                                <i class="fas fa-map-marked-alt w-5 text-slate-400"></i>
                                <span>分区平面图</span>
                            </a>
                        </li>
                        <li>
                            <a href="#materials" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition text-sm" data-page="materials">
                                <i class="fas fa-boxes w-5 text-slate-400"></i>
                                <span>应急物资</span>
                            </a>
                        </li>
                        <li>
                            <a href="#drills" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition text-sm" data-page="drills">
                                <i class="fas fa-fire-extinguisher w-5 text-slate-400"></i>
                                <span>演练记录</span>
                            </a>
                        </li>
                        <li>
                            <a href="#risk" class="nav-item flex items-center space-x-3 px-4 py-2.5 rounded-lg hover:bg-slate-700 transition text-sm" data-page="risk">
                                <i class="fas fa-chart-line w-5 text-slate-400"></i>
                                <span>风险排名</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>
            
            <div class="p-4 border-t border-slate-700">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 bg-gradient-to-br from-blue-500 to-purple-500 rounded-full flex items-center justify-center">
                        <span class="text-sm font-medium">管</span>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium">管理员</p>
                        <p class="text-xs text-slate-400">人防办</p>
                    </div>
                    <button class="text-slate-400 hover:text-white">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- 主内容区 -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- 顶部栏 -->
            <header class="bg-white shadow-sm px-6 py-4 flex items-center justify-between flex-shrink-0">
                <div class="flex items-center space-x-4">
                    <button id="toggleSidebar" class="p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-bars text-gray-600"></i>
                    </button>
                    <h2 id="pageTitle" class="text-xl font-semibold text-gray-800">统计看板</h2>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" placeholder="搜索..." class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <button class="relative p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-bell text-gray-600"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <button class="p-2 hover:bg-gray-100 rounded-lg">
                        <i class="fas fa-cog text-gray-600"></i>
                    </button>
                </div>
            </header>
            
            <!-- 内容区 -->
            <div id="content" class="flex-1 overflow-y-auto p-6">
                <!-- 页面内容将通过 JS 动态加载 -->
            </div>
        </main>
    </div>
    
    <!-- 模态框容器 -->
    <div id="modalContainer" class="hidden"></div>
    
    <script src="js/data.js"></script>
    <script src="js/pages.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
